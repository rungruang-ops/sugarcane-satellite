name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: canesat
          POSTGRES_PASSWORD: canesat
          POSTGRES_DB: canesat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canesat -d canesat"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://canesat:canesat@localhost:5432/canesat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Pytest (network tests are skipped by default)
        run: pytest
      - name: Build package
        run: |
          python -m pip install build
          python -m build --wheel --sdist
