[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "canesat"
version = "0.1.0"
description = "Sentinel-2 NDVI monitoring and 'greener-than-neighbours' anomaly alerts for sugarcane plots (Khon Kaen pilot)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "rungruang-ops" }]
dependencies = [
  "numpy>=1.26",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3.9",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "psycopg[binary]>=3.1",
  "click>=8.1",
  # LINE OA webhook (src/canesat/line)
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "line-bot-sdk>=3.11,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "pillow>=10"]

[project.scripts]
canesat = "canesat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/canesat"]

[tool.hatch.build.targets.wheel.force-include]
"src/canesat/migrations" = "canesat/migrations"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Thai text in strings/comments is intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = [
  "network: needs internet access to Planetary Computer (skipped by default; run with -m network)",
  "db: needs a PostGIS database at DATABASE_URL (skipped when DATABASE_URL is unset)",
]
