<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>เทียบเพื่อนบ้าน · เบิ่งไฮ่</title>
<link rel="stylesheet" href="/liff/static/register.css">
<script id="canesat-config" type="application/json">/*__CANESAT_CONFIG__*/{}</script>
<style>
  body { background:#f4f6f4; margin:0; font-family: system-ui, sans-serif; color:#1a1a1a; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px 14px 40px; }
  .card { background:#fff; border-radius:14px; padding:14px; margin-top:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  .sub { color:#666; font-size:.9rem; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .stat { flex:1; min-width:90px; background:#f7faf7; border-radius:10px; padding:10px; }
  .stat b { display:block; font-size:1.1rem; }
  .stat span { font-size:.75rem; color:#666; }
  canvas { width:100% !important; max-height:280px; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:.8rem; margin-top:8px; }
  .legend i { display:inline-block; width:12px; height:3px; margin-right:4px; vertical-align:middle; }
  .status-ok { color:#2e7d32; } .status-watch { color:#ef6c00; } .status-alert { color:#c62828; }
  .err { color:#c62828; padding:12px; }
  .note { font-size:.8rem; color:#888; margin-top:8px; }
</style>
</head>
<body>
<header class="hdr">
  <button id="btn-close" class="icon" aria-label="ปิด">✕</button>
  <div class="t">เทียบเพื่อนบ้าน</div>
  <span class="s">เบิ่งไฮ่</span>
</header>
<div class="wrap">
  <div id="err" class="err hidden"></div>
  <div id="main" class="hidden">
    <div class="card">
      <h1 id="title">—</h1>
      <div class="sub" id="subtitle">ความเขียวของอ้อย (จากภาพดาวเทียม)</div>
      <div class="stats">
        <div class="stat"><b id="s-latest">—</b><span>ล่าสุด</span></div>
        <div class="stat"><b id="s-status">—</b><span>สถานะ</span></div>
        <div class="stat"><b id="s-date">—</b><span>วันที่ภาพ</span></div>
      </div>
    </div>
    <div class="card">
      <canvas id="chart" height="240"></canvas>
      <div class="legend">
        <span><i style="background:#c62828"></i>แปลงของคุณ (ปีนี้)</span>
        <span><i style="background:#2e7d32"></i>เพื่อนบ้าน (ปีนี้)</span>
        <span><i style="background:#9e9e9e"></i>แปลงของคุณ (ปีที่แล้ว)</span>
      </div>
      <div class="note">แกนตั้ง = ความเขียว (NDVI) · เพื่อนบ้าน = ค่ามัธยฐานแปลงรอบ ๆ หรือพิกเซลอ้อยในวงแหวน · ปีที่แล้ว = ค่าของแปลงเดียวกันในปีก่อน</div>
    </div>
  </div>
</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script src="/liff/static/chart.js"></script>
</body>
</html>
